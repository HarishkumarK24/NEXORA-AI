version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=nexora-enterprise-super-secret-key
      - DATABASE_URL=sqlite:///./nexora.db
      - SIMULATION_MODE=true
    volumes:
      - ./backend/nexora.db:/app/nexora.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
